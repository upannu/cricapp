name: Promote dev to master

# Manual only — click "Run workflow" on this workflow in the Actions tab once
# you're happy with what's on `dev` (verified on the Vercel dev deployment).
# Merging into `master` is what triggers the Hostinger production deploy, so
# this builds `dev` first and only pushes to `master` if that build succeeds —
# a broken dev branch should never reach production just because someone
# clicked the button.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build dev branch as a safety check
        working-directory: web
        run: npm run build

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into master and push
        run: |
          git checkout master
          git merge dev --no-edit
          git push origin master

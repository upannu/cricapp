name: Pack auto-consume

# Runs daily against production only, late in the Sydney day (13:00 UTC = ~11pm-midnight Sydney
# depending on DST) so any group session scheduled today has already happened — draws down one
# session from every active pack whose agreed days include today, for any player who wasn't
# already marked in that day's attendance (see api/cron/pack-auto-consume). Not something to run
# against dev's cloned data on a schedule. workflow_dispatch is available for manual
# testing/backfill runs.
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pack auto-consume
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://crichq.com.au/api/cron/pack-auto-consume

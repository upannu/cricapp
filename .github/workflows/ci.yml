name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit-and-api-tests:
    runs-on: ubuntu-latest
    env:
      # Dummy values for routes that only need a well-formed client, never a
      # real network call — Supabase/Anthropic/nodemailer/etc. are mocked at
      # the module level in tests/unit and tests/api. Stripe is the one
      # exception (see decision log): those tests hit the real Stripe test API.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: test-cron-secret
      ANTHROPIC_API_KEY: test-anthropic-key
      GMAIL_USER: test@example.com
      GMAIL_APP_PASSWORD: test-app-password
      GOOGLE_MAPS_API_KEY: test-maps-key
      CLICKSEND_USERNAME: test-clicksend-user
      CLICKSEND_API_KEY: test-clicksend-key
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test

  # Playwright E2E against the Vercel Preview deployment for this PR. Requires
  # Vercel's GitHub integration to be connected (auto preview deploys) and, if
  # Deployment Protection is enabled on Preview, a Protection Bypass token —
  # otherwise the preview URL returns an auth wall and this job hangs/fails.
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [lint-and-typecheck, unit-and-api-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for Vercel preview
        id: wait-for-preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
      - name: Run Playwright tests
        run: npx playwright test --grep-invert @slow
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.wait-for-preview.outputs.url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # Only runs when the video-upload/pose-analysis pipeline itself changed —
  # real ffmpeg/MediaPipe processing on a fixture clip is slow, so unrelated
  # PRs shouldn't pay for it.
  video-pipeline-e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [lint-and-typecheck, unit-and-api-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            video:
              - 'web/components/NewSessionForm.tsx'
              - 'web/components/SessionsClient.tsx'
              - 'web/lib/pose.ts'
              - 'web/lib/transcode.ts'
              - 'web/lib/skeleton-overlay.ts'
              - 'web/lib/ball-tracking.ts'
              - 'web/lib/biomechanics.ts'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.video == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: steps.filter.outputs.video == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.filter.outputs.video == 'true'
      - name: Wait for Vercel preview
        if: steps.filter.outputs.video == 'true'
        id: wait-for-preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
      - name: Run video pipeline E2E
        if: steps.filter.outputs.video == 'true'
        run: npx playwright test --grep @slow
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.wait-for-preview.outputs.url }}

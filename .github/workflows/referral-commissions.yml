name: Referral commissions

# Runs once a month, computing the previous calendar month's ongoing referral commissions.
# workflow_dispatch is available for manual testing.
on:
  schedule:
    - cron: '0 1 1 * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger referral commissions
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://crichq.com.au/api/cron/referral-commissions
